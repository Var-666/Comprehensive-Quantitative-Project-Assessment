name: project-evaluation
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-project_eval}
      POSTGRES_DB: ${POSTGRES_DB:-project_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在本地.env中设置数据库密码}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - project_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    image: project-evaluation-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-project_eval}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-project_eval}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./模拟业务测试数据 V0.1.xlsx:/app/模拟业务测试数据 V0.1.xlsx:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
  worker:
    image: project-evaluation-backend
    command: ["python", "-m", "app.worker", "--interval", "60"]
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-project_eval}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-project_eval}
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  project_data:
